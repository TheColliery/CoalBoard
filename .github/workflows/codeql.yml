name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# The ONE room-specific value in the CWK-058 change. DELIBERATELY WIDER than ci.yml's list and
# the asymmetry is the point: CodeQL analyzes js/ts, so NO markdown anywhere needs a security
# scan -- while ci.yml must still run on a SHIPPED markdown artifact, because verify.mjs checks
# dist-sync. Two different questions, two different exempt sets; collapsing them into one
# shared list would be wrong for whichever workflow lost.
env:
  DOCS_GLOBS: "*.md **/*.md LICENSE"

# cancel-in-progress: TRUE -- a superseded CodeQL run simply never uploads its SARIF, and the
# previous analysis stands; nothing is left half-written. The newer push analyzes the newer tree,
# which is the state anyone cares about.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DOC-ONLY DETECTION (CWK-058). Moved here from the workflow-level `paths-ignore` that
  # used to sit on `on:`. VERIFIED AT SOURCE why it had to move (GitHub's own docs,
  # content/actions/how-tos/manage-workflow-runs/skip-workflow-runs.md): "If a workflow is
  # skipped due to path filtering ... then checks associated with that workflow will remain
  # in a 'Pending' state. A pull request that requires those checks to be successful will be
  # blocked from merging." A required check that never fires is not a saved minute, it is a
  # branch that can never merge without an owner bypass -- which is exactly the bypass line
  # every push to this repo has been echoing.
  #
  # DOCS_GLOBS is the only room-specific value here: an adopting room edits this DATA and
  # nothing else. It must mirror what this workflow's own analysis genuinely does not need.
  changes:
    # Named codeql-changed-paths, not the generic changed-paths (CWK-058 findings-back LOW-2):
    # ci.yml's own classifier job emits the identical generic name today, which is harmless
    # while neither is a required check but becomes a real collision the day either is added
    # to a ruleset -- two check-runs on one commit sharing one name. Cheap to avoid now rather
    # than disambiguate later.
    name: codeql-changed-paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      files: ${{ steps.detect.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        # DOCS_GLOBS comes from the workflow-level `env:` above, which GitHub exports into
        # every step's shell -- no per-step re-declaration, which would be one more place to
        # drift (CWK-058 findings-back LOW-3: this file used to re-declare it here while
        # ci.yml's own comment argues explicitly against exactly that; ci.yml already followed
        # its own rule, so this file was the one that had to change).
        shell: bash
        run: |
          set -euo pipefail
          # `set -f` (noglob) is LOAD-BEARING, not hygiene. Without it, `for g in $DOCS_GLOBS`
          # PATHNAME-EXPANDS the patterns against the checked-out tree before the loop runs, so
          # `*.md` silently becomes "the .md files that happen to exist here" and the comparison
          # is against filenames rather than patterns. `set -f` stops the EXPANSION while
          # leaving `case` pattern matching intact, which is exactly the split we need. (An
          # expansion bug here could only ever cause OVER-running, never a silent skip, because
          # of the fail-safe polarity below -- which is the reason that polarity is chosen
          # rather than merely preferred.)
          set -f
          # FAIL-SAFE POLARITY, and it is the whole safety argument: anything this step
          # cannot determine counts as CODE, never as docs-only. A wrong "docs-only" skips a
          # real analysis silently; a wrong "code" costs one cheap job. Never invert this.
          #
          # RUN-TIME RANDOM HEREDOC DELIMITER (CWK-074). A FIXED delimiter ("EOF") is forgeable:
          # a diff containing a file literally named `EOF` terminates the `files<<EOF` block
          # early, and the NEXT line of $changed then parses as a fresh top-level `key=value`
          # pair -- a file named `code=false` overwrites the real classifier verdict with no
          # code execution at all (a forged green with nothing run), and a file named
          # `code=x$(...)` / `` code=x`...` `` makes outputs.code ATTACKER-CHOSEN TEXT. Proven
          # end-to-end (real emit() shape, a real $GITHUB_OUTPUT parser, the real consumer
          # line, run in bash) -- see the CWK-074 commit message (82a9235) for the payload
          # families and results; the harness itself is a gitignored scratch file, not a
          # citable path.
          #
          # THE FIX WORKS BY ORDERING, NOT ENTROPY -- write this down because it is subtle and
          # someone will later "strengthen" a property that never came from here: $RANDOM is
          # generated AFTER the attacker's filenames are already frozen in $changed, so $RANDOM
          # not being a CSPRNG is irrelevant. An attacker cannot forge a value they cannot see
          # in advance, however guessable that value's distribution is.
          emit() {
            local delim="cwk074_${GITHUB_RUN_ID:-0}_${RANDOM}${RANDOM}${RANDOM}_$$"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "files<<$delim" >> "$GITHUB_OUTPUT"
            echo "${2:-}" >> "$GITHUB_OUTPUT"
            echo "$delim" >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "not a push event -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "${before}^{commit}" >/dev/null 2>&1; then
            echo "no usable base commit -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          if [ -z "$changed" ]; then
            echo "empty diff -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            matched=false
            for g in $DOCS_GLOBS; do
              # shellcheck disable=SC2254
              case "$f" in $g) matched=true; break ;; esac
            done
            if [ "$matched" = false ]; then code=true; fi
          done <<< "$changed"
          echo "changed files:"; echo "$changed"
          echo "code=$code"
          emit "$code" "$changed"
  analyze:
    name: analyze (javascript)
    needs: changes
    # NOTE: the JOB is deliberately NOT `if:`-skipped. It must run so that a check-run named
    # `analyze (javascript)` exists for the ruleset to evaluate -- and so that the honesty step
    # below can SAY what happened. A skipped job reports a bare "skipped" with no explanation
    # anywhere a reader will find it.
    # `if: always()` for the SAME reason all-green checks its classifier: without it, a FAILED
    # `changes` job leaves this job skipped, and a skipped required check satisfies the ruleset
    # -- a green gate with neither a classification nor an analysis behind it. The job now
    # always runs and decides for itself, refusing below if the classifier did not succeed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      # HONESTY STEP (CWK-058), FIRST so it is the first thing a reader sees. This check now
      # fires on every push, so it must distinguish "analyzed and clean" from "analyzed
      # nothing" from "the classifier itself failed" without anyone reading a commit message.
      - name: what this check actually did
        # MEDIUM-1 (CWK-058 findings-back): `files` is git-diff-derived, repository-controlled
        # data -- a filename like `` `id` `` or `$(curl ...)` would be expanded INTO the script
        # text before bash ever parses it if interpolated directly (the same
        # `${{ github.event.* }}` script-injection class lens-prompts.md already names, applied
        # to a needs.*.outputs.* value instead of an event field). Routed through env: so
        # Actions hands it to the shell as DATA, in an environment variable, never as script
        # text -- the same pattern this file's own `detect` step already uses for DOCS_GLOBS.
        #
        # CODE (CWK-074): the same routing, for the same reason, for `outputs.code`. The
        # run-time random delimiter in `emit()` already closes today's forgery path (a diff
        # filename can no longer overwrite this output), but an interpolated `${{ }}` consumer
        # is a live sink the day anything else influences the value -- defence in depth, not
        # a claim that this alone was the vulnerability. Proven end-to-end (3 of 4 payload
        # families execute against this exact line's un-fixed form) -- see the CWK-074 commit
        # message (82a9235) for the payload families and results.
        env:
          FILES: ${{ needs.changes.outputs.files }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            {
              echo "### analyze (javascript): FAILED -- the path classifier did not run"
              echo ""
              echo "\`changed-paths\` finished as \`${{ needs.changes.result }}\`, so this job cannot"
              echo "tell whether an analysis was needed. It refuses rather than reporting either way."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "changed-paths=${{ needs.changes.result }} -- refusing"
            exit 1
          fi
          # LOW-1 (CWK-058 findings-back): `changes` can SUCCEED while emitting no verdict at
          # all (code neither true nor false) -- reachability is low (emit() is unconditional
          # on every path, and set -euo pipefail would fail the step first if the
          # $GITHUB_OUTPUT write itself failed), but an unguarded fall-through would take the
          # false branch below and report "NO ANALYSIS RAN" as if a real classification had
          # happened. Refuse instead of guessing.
          case "$CODE" in
            true|false) ;;
            *) echo "classifier emitted no verdict -- refusing"; exit 1 ;;
          esac
          if [ "$CODE" = "true" ]; then
            {
              echo "### analyze (javascript): a REAL CodeQL analysis will run"
              echo ""
              echo "Non-doc paths changed, so init + analyze run NEXT in this job. This step runs"
              echo "FIRST, before them -- it states intent, not a verified result. See the final"
              echo "step's summary line below for whether they actually succeeded."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### analyze (javascript): NO ANALYSIS RAN -- this is not a clean bill of health"
              echo ""
              echo "Every changed path is markdown or LICENSE, which CodeQL does not analyze, so"
              echo "**no query was executed and no SARIF was uploaded.** The previous analysis for"
              echo "this branch is unchanged and still stands; nothing new was scanned."
              echo ""
              echo "This check reports success only so the branch ruleset that requires"
              echo "\`analyze (javascript)\` is satisfiable on a doc-only change. Read it as"
              echo "\"there was nothing to analyze\", never as \"the analysis passed\"."
              echo ""
              echo "Changed paths:"
              echo '```'
              echo "$FILES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
      - id: init
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
      # LOW-1 (CWK-074 findings-back): the FIRST honesty step above runs BEFORE checkout/init/
      # analyze exist in this job, so its own "will run" branch can only state INTENT -- it
      # cannot consult a step outcome that has not happened yet. Asserting COMPLETION there
      # ("...executed and the SARIF was uploaded", the wording this step replaced) would be
      # exactly the assert-without-consulting defect this whole campaign exists to close, one
      # level in. This step runs LAST (if: always(), ids above) and reports the REAL outcome.
      # THE GATE ITSELF IS NOT FOOLED EITHER WAY: a failed init/analyze already fails this job
      # and the required check `analyze (javascript)` goes red regardless of what any summary
      # line says -- so the defect this closes is a LYING SUMMARY BESIDE A RED CHECK, never a
      # forged green (do not inflate this into the same class as the heredoc-forgery finding).
      - name: what this check actually verified
        if: always()
        env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CODE" != "true" ]; then
            echo "no analysis was scheduled this run -- nothing to verify"
            exit 0
          fi
          {
            echo ""
            echo "### analyze (javascript): verified outcome"
            echo ""
            echo "checkout: \`${{ steps.checkout.outcome }}\` | init: \`${{ steps.init.outcome }}\` | analyze: \`${{ steps.analyze.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
